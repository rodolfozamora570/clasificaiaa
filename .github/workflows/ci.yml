# Integración continua: entrenar, probar, escanear y publicar la imagen en GHCR.

name: ci

on:
  push:
    branches: [main]

jobs:
  probar-y-publicar:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - run: python modelo/entrenar.py

      - run: pytest -q

      - run: docker build -t clasificaia:ci .

      # Escaneo de vulnerabilidades críticas
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: clasificaia:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # Inicio de sesión en GitHub Container Registry
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publicación de las etiquetas latest y hito2
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:hito2